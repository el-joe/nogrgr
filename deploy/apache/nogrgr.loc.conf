# Nogrgr local dev — central site nogrgr.loc, tenant stores on *.nogrgr.loc (e.g. vendor.nogrgr.loc)
<VirtualHost *:80>
    ServerName nogrgr.loc
    ServerAlias *.nogrgr.loc

    DocumentRoot /var/www/nogrgr/backend/public

    <Directory /var/www/nogrgr/backend/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/nogrgr_error.log
    CustomLog ${APACHE_LOG_DIR}/nogrgr_access.log combined
</VirtualHost>
